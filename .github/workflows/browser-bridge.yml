name: LMArena 24/7 Cloud Browser Bridge

on:
  workflow_dispatch: # Allows manual trigger anytime
  schedule:
    - cron: '0 */5 * * *' # Automatically restarts every 5 hours for 24/7 uptime

jobs:
  run-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ~5.8 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Launch Cloud Browser Bridge
        env:
          PYTHONUNBUFFERED: "1"
          ARENA_AUTH_COOKIE: ${{ secrets.ARENA_AUTH_COOKIE }}
        run: |
          python3 -u run_github_runner.py
